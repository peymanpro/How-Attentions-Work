<text x="180" y="192" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Q1 Q2 | Q3 Q4</text>
<line x1="345" y1="185" x2="455" y2="185" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="192" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">K1 V1 | K2 V2</text>
