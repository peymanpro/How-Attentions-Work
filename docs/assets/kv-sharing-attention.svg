<text x="180" y="252" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Q1 Q2 Q3 Q4</text>
<line x1="345" y1="245" x2="455" y2="245" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
