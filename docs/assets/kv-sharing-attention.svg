  <text x="32" y="68" font-family="Arial, sans-serif" font-size="16" fill="#475569">Reduce the number of key/value heads while keeping multiple query heads</text>
  <rect x="45" y="100" width="810" height="50" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
   <text x="450" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">MHA</text>
<text x="180" y="132" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Q1 Q2 Q3 Q4</text>
<line x1="345" y1="125" x2="455" y2="125" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
<text x="475" y="132" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">K1 K2 K3 K4</text>
<rect x="45" y="160" width="810" height="50" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
